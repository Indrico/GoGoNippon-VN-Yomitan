name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install x86 Windows toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686-posix gcc-mingw-w64-i686-posix
      - run: npm ci
      - run: npm run vendor
      - run: npm run build:native
      - run: npm run package:dist
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: GoGoNippon-Study-Windows
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/GoGoNippon-Study-*-Windows-x64-Setup.exe
            dist/GoGoNippon-Study-*-Windows-x64-Portable.7z
            dist/GoGoNippon-Study-*-Source.zip
            dist/SHA256SUMS.txt
